name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 platform-tools'

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for build..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          elif [ -f ./gradlew.bat ]; then
            echo "Windows wrapper found but Linux wrapper is missing."
            exit 1
          else
            echo "Gradle wrapper (gradlew) is missing from repository root."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yt-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
